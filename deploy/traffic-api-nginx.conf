# ================= traffic_api nginx HTTPS 反向代理配置模板 =================
# 使用方法：
#   1) 把下面的 __DOMAIN__ 替换为你的实际域名（如 api.example.com）
#   2) 证书二选一：
#      A. certbot 自动申请（推荐，可自动续期）：
#         apt install -y certbot python3-certbot-nginx
#         certbot --nginx -d __DOMAIN__ --redirect
#         执行后 certbot 会自动改写本配置为 443 + HTTP跳HTTPS（无需手动放证书路径）
#      B. 阿里云免费 SSL 证书（控制台申请 DV 证书 → 下载 nginx 格式）：
#         把证书上传到 /etc/nginx/ssl/traffic_api.pem 和 traffic_api.key
#   3) 保存后：nginx -t && systemctl reload nginx
#   4) 云服务器安全组/防火墙放行 443（HTTP 80 也保留用于跳转与 certbot 验证）

server {
    listen 80;
    server_name __DOMAIN__;
    # HTTP 全部跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # 证书路径（方案 A certbot 会自动改写；方案 B 保持如下）
    ssl_certificate     /etc/nginx/ssl/traffic_api.pem;
    ssl_certificate_key /etc/nginx/ssl/traffic_api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 接口会接收路线坐标数据，放宽 body 上限
    client_max_body_size 20m;

    # Django 静态文件（admin 等页面使用）
    location /static/ {
        alias /home/traffic_api/staticfiles/;
    }

    # 业务接口反向代理到 gunicorn（127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
