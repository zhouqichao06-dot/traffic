# ================= traffic_api nginx HTTP + HTTPS 双协议并存配置模板 =================
# 使用方式：
#   1) 把下面的 __DOMAIN__ 替换为你的实际域名（如 api.example.com；无域名用 IP 时填 IP）
#   2) 证书二选一：
#      A. certbot 自动申请（推荐，可自动续期）：
#         apt install -y certbot python3-certbot-nginx
#         certbot --nginx -d __DOMAIN__
#         注意：certbot 默认会追加 HTTP→HTTPS 跳转；想保留 HTTP 并存，
#         执行后手动把 80 端口 server 里的 return 301 行去掉（或用本模板 80 块覆盖）
#      B. 阿里云免费 SSL 证书（控制台申请 DV 证书 → 下载 nginx 格式）：
#         把证书上传到 /etc/nginx/ssl/traffic_api.pem 和 traffic_api.key
#   3) 保存后：nginx -t && systemctl reload nginx
#   4) 云服务器安全组/防火墙需同时放行 80（HTTP）与 443（HTTPS）

# ---- HTTP：80 直接反代（不再跳转 HTTPS，与 HTTPS 并存生效）----
server {
    listen 80;
    server_name __DOMAIN__;

    # 接口会接收路线坐标数据，放宽 body 上限
    client_max_body_size 20m;

    # Django 静态文件（admin 等页面使用）
    location /static/ {
        alias /home/traffic_api/staticfiles/;
    }

    # 业务接口反向代理到 gunicorn（127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

# ---- HTTPS：443 SSL 反代（与 HTTP 并存生效）----
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # 证书路径（方案 A certbot 会自动改写；方案 B 保持如下）
    ssl_certificate     /etc/nginx/ssl/traffic_api.pem;
    ssl_certificate_key /etc/nginx/ssl/traffic_api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location /static/ {
        alias /home/traffic_api/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
